host: medcore-his-api-latest.onrender.com
info:
  contact:
    email: support@medcore.local
    name: MedCore Team
  description: |-
    Modern Hospital Information System API
    Modules disponibles : Auth, Patients, Insurance, Workflow, Audit.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: MedCore HIS API
  version: 0.1.0
paths:
  /api/consultations:
    post:
      consumes:
      - application/json
      description: Crée une consultation médicale avec motifs, constantes vitales,
        antécédents, examens physiques par organe, examens demandés, ordonnance structurée,
        traitements administrés sur place, repos maladie et hospitalisation.
      parameters:
      - description: Consultation à créer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/consultations.CreateConsultationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/consultations.Consultation'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Créer une consultation
      tags:
      - Consultations
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authentifie un utilisateur MedCore et retourne un JWT.
      parameters:
      - description: Identifiants utilisateur
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/openapi.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/openapi.ErrorResponse'
      summary: Connexion utilisateur
      tags:
      - Authentication
  /consultations/{id}:
    get:
      parameters:
      - description: ID consultation
        in: path
        name: id
        required: true
        type: integer
      produces:
