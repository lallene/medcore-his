name: Backend Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Explicit --target api: historical consumer of medcore-his-api:latest.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: ghcr.io/lallene/medcore-his-api:latest

      # Separate artifact; never replaces the API image tag.
      - name: Build and push notification-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: notification-worker
          push: true
          tags: ghcr.io/lallene/medcore-his-notification-worker:latest
